<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>پنل مدیریت پیکان‌خان</title>
  <!-- این خط کلید حل مشکله: به CMS دستور میده تا خودمون نگفتیم دنبال فایل نگردد -->
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <!-- لود کردن کتابخانه Decap CMS -->
  <script src="https://unpkg.com/decap-cms@3.1.2/dist/decap-cms.js"></script>
  
  <!-- استارت دستی با تنظیمات اختصاصی ما -->
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'x-iran-x/peykan-khan.github.io',
          branch: 'main',
          base_url: 'https://decap-cms-oauth.vercel.app'
        },
        load_config_file: false,
        display_url: 'https://x-iran-x.github.io/peykan-khan.github.io/',
        media_folder: 'images',
        public_folder: '/images',
        collections: [
          {
            name: 'posts_collection',
            label: 'پست‌ها',
            files: [
              {
                file: 'posts.json',
                label: 'مدیریت کل پست‌های سایت',
                name: 'all_posts',
                fields: [
                  {
                    label: 'لیست پست‌ها',
                    name: 'posts',
                    widget: 'list',
                    fields: [
                      { label: 'شناسه (ID عددی)', name: 'id', widget: 'number', value_type: 'int' },
                      { label: 'عنوان', name: 'title', widget: 'string' },
                      { label: 'نوع (Type)', name: 'type', widget: 'select', options: ['book', 'cinema', 'mod', 'article'] },
                      { label: 'دسته‌بندی', name: 'category', widget: 'string' },
                      { label: 'تاریخ', name: 'date', widget: 'string' },
                      { label: 'توضیحات کوتاه', name: 'description', widget: 'text' },
                      { label: 'محتوا (HTML)', name: 'content', widget: 'text' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
