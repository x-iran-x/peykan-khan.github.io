<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل مدیریت محتوای پیکان‌خان</title>
</head>
<body>
  <!-- اسکریپت اصلی Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'x-iran-x/peykan-khan.github.io',
          branch: 'main',
          base_url: 'https://decap-cms-oauth.vercel.app'
        },
        media_folder: 'images',
        public_folder: '/images',
        collections: [
          {
            name: 'content',
            label: 'مدیریت محتوا',
            files: [
              {
                name: 'posts_list',
                label: 'لیست پست‌ها',
                file: 'posts.json',
                format: 'json',
                fields: [
                  {
                    name: 'posts',
                    label: 'پست‌ها',
                    widget: 'list',
                    fields: [
                      { label: 'شناسه (ID)', name: 'id', widget: 'number', value_type: 'int' },
                      { label: 'عنوان', name: 'title', widget: 'string' },
                      { label: 'نوع (book/cinema/mod)', name: 'type', widget: 'string' },
                      { label: 'دسته‌بندی', name: 'category', widget: 'string' },
                      { label: 'تاریخ', name: 'date', widget: 'string' },
                      { label: 'توضیحات کوتاه', name: 'description', widget: 'text' },
                      { label: 'محتوا (HTML)', name: 'content', widget: 'text' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
