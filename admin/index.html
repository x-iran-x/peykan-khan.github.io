<!DOCTYPE html>
<html lang="fa" dir="rtl" class="notranslate" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>پنل مدیریت محتوای پیکان‌خان</title>
</head>
<body class="notranslate">
  <!-- اسکریپت دکپ سی‌ام‌اس نسخه پایدار -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'x-iran-x/peykan-khan.github.io',
          branch: 'main',
          base_url: 'https://decap-cms-oauth.vercel.app'
        },
        display_url: 'https://x-iran-x.github.io/peykan-khan.github.io/',
        media_folder: 'images',
        public_folder: '/images',
        collections: [
          {
            name: 'posts_collection',
            label: 'مدیریت پست‌ها',
            files: [
              {
                name: 'posts_data',
                label: 'تمام پست‌های سایت',
                file: 'posts.json',
                fields: [
                  {
                    label: 'لیست پست‌ها',
                    name: 'posts',
                    widget: 'list',
                    fields: [
                      { label: 'شناسه (ID عددی)', name: 'id', widget: 'number', value_type: 'int', default: 1 },
                      { label: 'عنوان', name: 'title', widget: 'string' },
                      { label: 'نوع (book/cinema/mod)', name: 'type', widget: 'select', options: ['book', 'cinema', 'mod', 'article'], default: 'book' },
                      { label: 'دسته‌بندی (انگلیسی کوچک)', name: 'category', widget: 'string', default: 'story' },
                      { label: 'تاریخ', name: 'date', widget: 'string' },
                      { label: 'توضیحات کوتاه', name: 'description', widget: 'text' },
                      { label: 'محتوا (HTML)', name: 'content', widget: 'text' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
