<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Peykan Khan Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'x-iran-x/peykan-khan.github.io',
          branch: 'main',
          base_url: 'https://decap-cms-oauth.vercel.app'
        },
        display_url: 'https://x-iran-x.github.io/peykan-khan.github.io/',
        media_folder: 'images',
        public_folder: '/images',
        collections: [
          {
            name: 'posts',
            label: 'پست‌ها',
            delete: false,
            files: [
              {
                name: 'all_posts',
                label: 'ویرایش و افزودن پست‌ها',
                file: 'posts.json',
                description: 'مدیریت کل پست‌های سایت پیکان‌خان',
                fields: [
                  {
                    label: 'لیست پست‌ها',
                    name: 'posts',
                    widget: 'list',
                    summary: '{{fields.title}}',
                    fields: [
                      { label: 'شناسه (ID عددی)', name: 'id', widget: 'number', value_type: 'int' },
                      { label: 'عنوان', name: 'title', widget: 'string' },
                      { label: 'نوع (book/cinema/mod)', name: 'type', widget: 'select', options: ['book', 'cinema', 'mod', 'article'] },
                      { label: 'دسته‌بندی', name: 'category', widget: 'string' },
                      { label: 'تاریخ', name: 'date', widget: 'string' },
                      { label: 'توضیحات کوتاه', name: 'description', widget: 'text' },
                      { label: 'محتوا (HTML)', name: 'content', widget: 'text' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
