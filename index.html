<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peykan Khan | پیکان خان</title>
    <style>
        :root {
            --primary-color: #ffcc00; 
            --bg-color: #121212;      
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            text-align: center;
            padding: 60px 20px;
            width: 100%;
            background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-color) 100%);
        }

        .logo-wrapper {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid var(--primary-color);
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.3);
            background-color: #333;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 2.8rem;
            margin: 10px 0;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        /* بخش محتوا - بسیار مینیمال */
        .main-content {
            max-width: 700px;
            width: 90%;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 50px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .card:hover {
            border: 1px solid var(--primary-color);
        }

        .card p {
            margin: 0;
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.8;
        }

        footer {
            margin-top: auto;
            padding: 30px;
            font-size: 0.8rem;
            color: #444;
        }

    </style>
</head>
<body>

    <header class="header-container">
        <div class="logo-wrapper">
            <img src="https://www.upload.ee/image/19665651/logo.jpg" alt="Peykan Khan Logo">
        </div>
        <h1>پیکان خان</h1>
    </header>

    <main class="main-content">
        <!-- اگر متن خاصی مد نظرت هست، همینجا جایگزین کن -->
        <section class="card">
            <p>خوش آمدید به وب‌سایت رسمی پیکان خان</p>
        </section>
    </main>

    <footer>
        &copy; 2026 Peykan Khan
    </footer>

</body>
</html>
