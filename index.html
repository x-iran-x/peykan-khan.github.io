<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیکان‌خان | Peykan Khan</title>
    <style>
        /* استایل پایه و تم تاریک */
        body {
            background-color: #0f0f0f; /* مشکی خیلی تیره */
            color: #e0e0e0; /* خاکستری روشن برای متن */
            font-family: 'Tahoma', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* هدر یا سربرگ سایت */
        header {
            width: 100%;
            padding: 40px 0;
            text-align: center;
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            border-bottom: 2px solid #333;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            color: #bb86fc; /* بنفش نئونی خفن */
            text-shadow: 0 0 15px rgba(187, 134, 252, 0.5);
        }

        /* کانتینر اصلی برای محتوا */
        .container {
            max-width: 800px;
            width: 90%;
            margin-top: 30px;
            text-align: center;
        }

        /* استایل جای لوگو (فعلاً یک دایره شیک می‌ذاریم) */
        .logo-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #222;
            border: 3px solid #bb86fc;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #666;
            box-shadow: 0 0 20px rgba(187, 134, 252, 0.2);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #b0b0b0;
        }

        /* دکمه یا لینک‌های خفن */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #bb86fc;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #03dac6; /* تغییر رنگ به سبز نئونی هنگام هاور */
            transform: scale(1.05);
        }

    </style>
</head>
<body>

    <header>
        <div class="logo-placeholder">
            <!-- اینجا بعداً لوگو رو می‌ذاریم -->
            LOGO HERE
        </div>
        <h1>پیکان‌خان</h1>
        <p>دنیای نویسندگی، گیمینگ و تکنولوژی</p>
    </header>

    <div class="container">
        <p>خوش اومدی دادا! اینجا اولین قدم برای ساختن قلمروی اختصاصیه.</p>
        <a href="#" class="btn">بیشتر بدانید</a>
    </div>

</body>
    </html>
