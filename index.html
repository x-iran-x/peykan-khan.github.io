<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peykan Khan | پیکان خان</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- صفحه‌ی خوش‌آمدگویی -->
    <div class="landing" id="landing">

        <div class="logo-wrapper">
            <img
                src="https://www.upload.ee/image/19665651/logo.jpg"
                alt="لوگوی پیکان خان"
            >
        </div>

        <h1>پیکان خان</h1>

        <button class="go-btn" id="goBtn">
            بزن بریم 🚀
        </button>

    </div>

    <!-- محتوای اصلی سایت -->
    <main class="site-content" id="siteContent">

        <!-- صفحه‌ی خانه -->
        <section class="page-section active-page" id="homePage">

            <header class="home-header">
                <h2>📢 پست‌های تازه</h2>
                <p>جدیدترین مطالب پیکان خان</p>
            </header>

            <div id="latestPosts" class="posts-list"></div>

        </section>

        <!-- صفحه‌ی مقاله‌ها -->
        <section class="page-section" id="articlesPage">

            <div class="section-header">
                <button class="back-btn" data-page="homePage">← بازگشت</button>
                <h2>📰 مقاله‌ها</h2>
            </div>

            <div id="articleCategories" class="categories-grid"></div>
            <div id="articlePosts" class="posts-list"></div>

        </section>

        <!-- صفحه‌ی مودها -->
        <section class="page-section" id="modsPage">

            <div class="section-header">
                <button class="back-btn" data-page="homePage">← بازگشت</button>
                <h2>🎮 مودها</h2>
            </div>

            <div id="modCategories" class="categories-grid"></div>
            <div id="modPosts" class="posts-list"></div>

        </section>

        <!-- صفحه‌ی کتاب‌ها -->
        <section class="page-section" id="booksPage">

            <div class="section-header">
                <button class="back-btn" data-page="homePage">← بازگشت</button>
                <h2>📚 کتاب‌ها</h2>
            </div>

            <div id="bookCategories" class="categories-grid"></div>
            <div id="bookPosts" class="posts-list"></div>

        </section>

        <!-- صفحه‌ی فیلم‌ها -->
        <section class="page-section" id="moviesPage">

            <div class="section-header">
                <button class="back-btn" data-page="homePage">← بازگشت</button>
                <h2>🎬 فیلم‌ها</h2>
            </div>

            <div id="movieCategories" class="categories-grid"></div>
            <div id="moviePosts" class="posts-list"></div>

        </section>

        <!-- صفحه‌ی جست‌وجو -->
        <section class="page-section" id="searchPage">

            <div class="section-header">
                <button class="back-btn" data-page="homePage">← بازگشت</button>
                <h2>🔍 جست‌وجو</h2>
            </div>

            <div class="search-box">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="نام فیلم، کتاب، مود یا مقاله را بنویس..."
                >

                <button id="searchBtn">
                    جست‌وجو
                </button>
            </div>

            <p id="searchMessage" class="search-message"></p>

            <div id="searchResults" class="posts-list"></div>

        </section>

        <!-- صفحه‌ی اختصاصی هر پست -->
        <section class="page-section" id="postPage">

            <div class="section-header">
                <button class="back-btn" data-page="homePage">← بازگشت</button>
                <h2>📄 مشاهده‌ی پست</h2>
            </div>

            <article id="singlePost" class="single-post"></article>

        </section>

    </main>

    <!-- نوار منوی پایین -->
    <nav class="bottom-nav" id="bottomNav">

        <button class="nav-item active" data-page="homePage">
            <span>🏠</span>
            <small>خانه</small>
        </button>

        <button class="nav-item" data-page="articlesPage">
            <span>📰</span>
            <small>مقاله‌ها</small>
        </button>

        <button class="nav-item" data-page="modsPage">
            <span>🎮</span>
            <small>مودها</small>
        </button>

        <button class="nav-item" data-page="booksPage">
            <span>📚</span>
            <small>کتاب‌ها</small>
        </button>

        <button class="nav-item" data-page="moviesPage">
            <span>🎬</span>
            <small>فیلم‌ها</small>
        </button>

        <button class="nav-item" data-page="searchPage">
            <span>🔍</span>
            <small>جست‌وجو</small>
        </button>

    </nav>

    <!-- اعلان در دست ساخت -->
    <div class="toast" id="toast"></div>

    <script src="app.js"></script>

</body>
</html>
